<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Intérprete FOR</title>
    <style>
        body {
            background-color: #f9f3f3;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
            margin: 0;
        }

        h2 {
            margin-bottom: 15px;
            color: #ff6b81;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 320px;
        }

        textarea {
            width: 100%;
            height: 120px;
            border: 2px solid #ff6b81;
            border-radius: 12px;
            padding: 10px;
            font-size: 14px;
            resize: none;
            background: #fff0f2;
            color: #333;
            outline: none;
        }

        textarea:focus {
            border-color: #ff4757;
            box-shadow: 0 0 5px rgba(255, 71, 87, 0.5);
        }

        button {
            background: #ff6b81;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease-in-out;
        }

        button:hover {
            background: #ff4757;
            transform: scale(1.05);
        }

        h3 {
            margin-top: 25px;
            color: #ff6b81;
        }

        pre {
            background: #fff0f2;
            border: 1px solid #ff6b81;
            border-radius: 12px;
            padding: 10px;
            width: 320px;
            min-height: 100px;
            margin-top: 10px;
            white-space: pre-wrap;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Ciclo FOR</h2>
    <form id="formulario">
        <textarea id="codigo" name="codigo" placeholder="Escribe tu código aquí..."></textarea>
        <button type="submit">Ejecutar</button>
    </form>

    <h3>Resultados</h3>
    <pre id="iteraciones"></pre>

    <script>
        document.getElementById("formulario").addEventListener("submit", async function(e) {
            e.preventDefault();
            const codigo = document.getElementById("codigo").value;
            try {
                const response = await fetch("/ejecutar/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: "codigo=" + encodeURIComponent(codigo)
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById("iteraciones").textContent = "❌ Error: " + data.error;
                } else {
                    // Limpiar formato: quitar corchetes, comillas y paréntesis
                    const limpio = data.iteraciones.map(it => {
                        return it.replace(/[\[\]{}'"]/g, "");
                    }).join("\n");
                    document.getElementById("iteraciones").textContent = limpio;
                }
            } catch (err) {
                document.getElementById("iteraciones").textContent = "❌ Error: " + err;
            }
        });
    </script>
</body>
</html>
